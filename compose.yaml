services:
  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://inventory_lab:inventory_lab_local@postgres:5432/inventory_lab
      REDIS_URL: redis://redis:6379
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FIELDSTOCK_APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory_lab
      POSTGRES_PASSWORD: inventory_lab_local
      POSTGRES_DB: inventory_lab
    ports:
      - "127.0.0.1:${FIELDSTOCK_POSTGRES_PORT:-55432}:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "inventory_lab", "-d", "inventory_lab"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${FIELDSTOCK_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
  eval:
    profiles: ["eval"]
    build:
      context: .
      target: eval
    network_mode: none
volumes:
  inventory-data:
